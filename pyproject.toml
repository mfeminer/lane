[project]
name = "lane"
description = "Run several pieces of work side by side, each in its own git worktree"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
lane = "lane.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Single source of truth for the version: the git tag. Releasing is `git tag
# vX.Y.Z && git push --tags` and nothing else — no file in the tree carries the
# number, so no file in the tree can disagree with the tag.
[tool.hatch.version]
source = "vcs"

# `no-guess-dev` is what keeps an untagged commit honest: it reports
# `0.0.2.post1.dev0+g1a2b3c4` — "after 0.0.2, unreleased" — rather than the
# default's `0.0.3.dev4`, which names a version that does not exist yet and
# would sort ahead of the 0.0.3 that eventually ships.
[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
# A source tree with no .git (an sdist) still has to build.
fallback_version = "0+unknown"

# Written at install time and at build time, so the number reaches a synced
# checkout, a wheel and the PyInstaller binary by the same route. Gitignored.
[tool.hatch.build.hooks.vcs]
version-file = "src/lane/_version.py"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RET",  # returns
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "TRY",  # exception antipatterns
    "RUF",
]
ignore = [
    "TRY003",  # long messages outside the exception class: lane's errors are user-facing prose
    "N818",    # exceptions read as prose here (Abandoned, PrerequisiteMissing), not as FooError
    # lane exists partly to handle non-ASCII input, and its UI uses pointer and
    # box glyphs on purpose. Flagging "ambiguous" characters is noise throughout.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on private helpers and use long descriptive names.
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
