name: CD

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the binary
        run: make build

      - name: Smoke test the binary
        run: |
          ./dist/lane --version
          ./dist/lane --help
          if ./dist/lane < /dev/null; then
            echo "expected a non-zero exit without a TTY" >&2
            exit 1
          fi

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: lane-macos-arm64-${{ github.ref_name }}
          path: dist/lane
          if-no-files-found: error
